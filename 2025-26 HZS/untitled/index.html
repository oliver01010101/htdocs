<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IIB - Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<h1>Iskolai incidens</h1>
<form class="col-5 m-2 p-2 border" action="submit.php" method="POST" >

    <h3>Hiba helye</h3>

    <div class="mb-3">
        <label for="building" class="form-label">Épület</label>
        <select class="form-select" id="building" name="building">
            <option value="becsi-uti-eoulet">Bécsi úti épület</option>
            <option value="kamara">Kamara</option>
            <option value="katakomba">Katakomba</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="floor" class="form-label">Szint: </label>
        <input type="number" class="form-control" id="floor" name="floor" min="5" max="40">
    </div>

    <div class="mb-3">
        <label for="room" class="form-label">Terem</label>
        <select class="form-select" id="room" name="room">
            <option value="22">22 - Igazgatói</option>
            <option value="117">117- Gépterem</option>
            <option value="217">217 - Rendszergazdai</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="category" class="form-label">Kategória</label>
        <select class="form-select" id="category" name="category">
            <option value="it">IT</option>
            <option value="maintenance">Karbantartás</option>
            <option value="tools">Oktatási eszköz</option>
        </select>
    </div>
    <div class="mb-3">
        <div class="form-check ps-5">
            <input class="form-check-input" type="radio" name="type" id="type-pc">
            <label class="form-check-label" for="type-pc"> PC</label>
        </div>

        <div class="form-check ps-5">
            <input class="form-check-input" type="radio" name="type" id="type-laptop">
            <label class="form-check-label" for="type-laptop"> Laptop</label>
        </div>

        <div class="form-check ps-5">
            <input class="form-check-input" type="radio" name="type" id="type-printer">
            <label class="form-check-label" for="type-printer"> Printer</label>
        </div>

        <div class="form-check ps-5">
            <input class="form-check-input" type="radio" name="type" id="type-wc">
            <label class="form-check-label" for="type-wc"> WC</label>
        </div>
    </div>

    <div class="mb-3">
        <label for="device" class="form-label">Szint: </label>
        <input type="number" class="form-control" id="device" name="device" min="5" max="40">
    </div>

    <div class="mb-3">
        <label for="floor" class="form-label">Eszköz név:</label>
        <input type="text" pattern="\d{10,10}" class="form-control" id="inventory-number" name="inventory-number" min="5" max="40">
    </div>

    <h3>Hiba részletei</h3>
    <div class="mb-3">
        <label for="error-details" class="form-label"></label>
        <textarea id="error-details" name="error-details"></textarea>
    </div>


    <div class="mb-3">
        <label for="datetime" class="form-label">Észlelés ideje</label>
        <input type="datetime-local" class="form-control" id="datetime" name="datetime">
    </div>
    <h3>Prioritás</h3>

    <label for="priority" class="form-label">Észlelés ideje: </label>

    <div class="input-group mb-3">
        <input type="range" class="form-control" id="priority" name="priority">

        <span class="input-group-text" id="output">X</span>
    </div>

    <script>
        const input = document.getElementById("priority");
        const output = document.getElementById("output");
        output.textContent = input.value;
        input.addEventListener("input", (e) => {
            output.textContent = e.target.value;
        })
    </script>
    <div class="mb-3">
        <label for="person-name">Bejelentő neve: </label>
        <input type="text" class="form-control" id="person-name" name="person-name">
    </div>

    <div class="mb-3">
        <label for="person-email">Bejelentő email címe:: </label>
        <input type="text" class="form-control" id="person-email" name="person-email">
    </div>

    <div class="mb-3">
        <label for="person-tel">Bejelentő telefonszáma: </label>
        <input type="text" class="form-control" id="person-tel" name="person-tel">
    </div>

    <h3>egyéb</h3>
    <div class="form-check ps-5">
        <input class="form-check-input" type="checkbox" id="consent" name="consent">
        <label class="form-chech-label" for="consent">
            Elfogadom
        </label>
    </div>

    <div class="mb-3">
        <input type="submit" class="form-control" value="küldés">
        <input type="reset" class="form-control" value="űrlap kiürítése">
    </div>
</form>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
